services:
  db:
    image: postgres:15-alpine
    container_name: exam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-exam_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-exam_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: exam-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
